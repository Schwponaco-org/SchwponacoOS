# hyprlock: the dashboard's look, locked. Blurred photo, big time and date on the left, and a password
# field that only shows once you type. Background: ~/Pictures/mies.jpg (not in the repo; any image works,
# without one it's plain #111111).

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/mies.jpg
    color = rgb(17, 17, 17)
    blur_passes = 3
    blur_size = 7
    brightness = 0.45
    vibrancy = 0
}

# time, as on the dashboard
label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 280
    font_family = Helvetica Neue Bold
    halign = left
    valign = center
    position = 64, 60
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B %Y"
    color = rgb(136, 136, 136)
    font_size = 46
    font_family = Helvetica Neue Medium
    halign = left
    valign = center
    position = 76, -160
}

input-field {
    monitor =
    size = 420, 52
    halign = left
    valign = bottom
    position = 76, 96
    rounding = 0
    outline_thickness = 0
    inner_color = rgba(17, 17, 17, 0.7)
    font_color = rgb(187, 187, 187)
    font_family = Helvetica Neue
    placeholder_text =
    fail_text = Wrong password
    fail_color = rgb(245, 60, 60)
    check_color = rgb(187, 187, 187)
    dots_size = 0.18
    dots_spacing = 0.5
    dots_center = false
    fade_on_empty = true
    fade_timeout = 800
}
