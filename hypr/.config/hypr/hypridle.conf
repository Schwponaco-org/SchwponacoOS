# hypridle: locks after 5 minutes (hyprlock, screen dimmed), screen off after 10, locks before sleep.
# Apps that ask to stay awake are respected: a browser playing video (any size, until paused) sends
# that request over D-Bus (org.freedesktop.ScreenSaver), which swayidle ignored.

general {
    # dims to 10% while locked; hyprlock blocks until unlock, then the saved brightness comes back
    lock_cmd = pidof hyprlock || (brightnessctl -sq set 10%; hyprlock; brightnessctl -rq)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
